{% extends "base.html" %}

{% block titulo %}Ingreso de administración · Escape Room 7.º B 2026{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="text-center mb-4">
      <h1 class="h3 fw-bold">Administración</h1>
      <p class="text-body-secondary mb-0">Escape Room 7.º B 2026</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('admin.autenticar') }}">
          {% include "_csrf_campo.html" %}
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input
              type="text"
              class="form-control"
              id="usuario"
              name="usuario"
              value="{{ usuario }}"
              autocomplete="username"
              required
              autofocus
            >
          </div>
          <div class="mb-4">
            <label for="clave" class="form-label">Clave</label>
            <input
              type="password"
              class="form-control"
              id="clave"
              name="clave"
              autocomplete="current-password"
              required
            >
          </div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 mb-0">
      <a href="{{ url_for('juego.bienvenida') }}">Volver al inicio</a>
    </p>
  </div>
</div>
{% endblock %}
